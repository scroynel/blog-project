<div class="flex items-start space-x-3">

    <!-- Comment Avatar -->
    <div class="w-9 h-9 rounded-full bg-indigo-100
                flex items-center justify-center
                text-indigo-600 text-sm font-semibold shrink-0">
        {{ comment.author.username|first|upper }}
    </div>

    <div class="flex-1 min-w-0">

        <!-- Comment Content -->
        <div class="bg-gray-50 rounded-xl px-4 py-3">

            <div class="flex items-center justify-between mb-1">
                <p class="text-xs font-semibold text-gray-900">
                    {{ comment.author.username }}
                </p>

                <p class="text-[10px] text-gray-400">
                    {{ comment.created_at|timesince }} ago
                </p>
            </div>
            
            <p class="text-sm text-gray-600 leading-relaxed">
                {{ comment.content }}
            </p>

            <div class="flex justify-end">
                <button
                    type="button"
                    onclick="document.getElementById('reply-{{ comment.pk }}').classList.toggle('hidden')"
                    class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 mt-2 ml-2">
                    <div class="flex items-center gap-1">
                        <svg class="w-4 h-4"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M9 14L4 9l5-5M4 9h11a5 5 0 015 5v1"/>
                        </svg>
                        Reply
                    </div>
                </button>
            </div>
            <!-- Reply Button -->
            
        </div>

        <!-- Reply Button -->
        <button
            type="button"
            onclick="document.getElementById('reply-{{ comment.pk }}').classList.toggle('hidden')"
            class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 mt-2 ml-2">
            <div class="flex items-center gap-1">
                <svg class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M9 14L4 9l5-5M4 9h11a5 5 0 015 5v1"/>
                </svg>
                Reply
            </div>
        </button>

        <!-- Reply Form -->
        <form
            id="reply-{{ comment.pk }}"
            method="POST"
            action="{% url 'create_comment' post.pk %}"
            class="hidden flex items-center gap-2 mt-3">

            {% csrf_token %}

            <input
                type="hidden"
                name="parent_id"
                value="{{ comment.pk }}">

            <input
                type="text"
                name="content"
                placeholder="Write a reply..."
                required
                class="flex-1 min-w-0 bg-gray-50 border border-gray-200
                       focus:bg-white focus:border-indigo-500
                       focus:ring-2 focus:ring-indigo-500/20
                       rounded-xl px-4 py-2 text-sm
                       focus:outline-none transition-all">

            <button
                type="submit"
                class="bg-indigo-600 hover:bg-indigo-700
                       text-white text-xs font-semibold
                       px-3 py-2 rounded-xl transition-colors">
                Send
            </button>

        </form>

        <!-- Nested Replies -->
        {% for comment in comment.reposts.all %}
            <div class="ml-5 mt-4 border-l-2 border-gray-100 pl-3">
                {% include "blog/includes/comment.html" %}
            </div>
        {% endfor %}

    </div>
</div>
